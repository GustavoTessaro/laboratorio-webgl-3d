name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/Laboratorio.Collaboration/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test backend/Laboratorio.Collaboration.Tests/Laboratorio.Collaboration.Tests.csproj --configuration Release
      - run: dotnet publish backend/Laboratorio.Collaboration/Laboratorio.Collaboration.csproj --configuration Release --output ./publish
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FFB8FF471FCF4492911A990A8C4DB53A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4CFBF919F7244157BF6D60A0BCB78376 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_12FEC0581C0A42B1B0C10CC940F525AA }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: laboratorio-webgl-3d-api
          package: ./publish
