name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/Laboratorio.Collaboration/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test backend/Laboratorio.Collaboration.Tests/Laboratorio.Collaboration.Tests.csproj --configuration Release
      - run: dotnet publish backend/Laboratorio.Collaboration/Laboratorio.Collaboration.csproj --configuration Release --output ./publish
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
